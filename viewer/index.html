<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camera Viewer</title>
    <style>
      :root {
        --bg: #111;
        --panel: #1c1c1c;
        --fg: #eee;
        --muted: #999;
        --accent: #4ea1ff;
        --border: #333;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          14px/1.4 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-size: 15px;
        margin: 0 12px 0 0;
      }
      select,
      button {
        background: #2a2a2a;
        color: var(--fg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover,
      select:hover {
        border-color: var(--accent);
      }
      label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
      }
      #stats {
        margin-left: auto;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
        padding: 12px;
      }
      video {
        max-width: 100%;
        max-height: 100%;
        background: #000;
        border-radius: 6px;
      }
      video.mirror {
        transform: scaleX(-1);
      }
      #capture.recording {
        background: #c62828;
        border-color: #ef5350;
      }
      #status {
        color: var(--muted);
      }
      #msg {
        color: var(--muted);
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Camera Viewer</h1>
      <select id="camera" title="Camera"></select>
      <select id="resolution" title="Resolution">
        <option value="640x480">640×480</option>
        <option value="1280x720" selected>1280×720</option>
        <option value="1920x1080">1920×1080</option>
        <option value="3840x2160">3840×2160</option>
      </select>
      <label><input type="checkbox" id="mirror" /> Mirror</label>
      <button id="capture">● Capture</button>
      <button id="snapshot">Snapshot</button>
      <button id="refresh">Refresh devices</button>
      <span id="status"></span>
      <span id="stats"></span>
    </header>
    <main>
      <video id="video" autoplay playsinline muted hidden></video>
      <div id="msg">Requesting camera access…</div>
    </main>
    <script>
      const video = document.getElementById("video");
      const cameraSel = document.getElementById("camera");
      const resSel = document.getElementById("resolution");
      const mirror = document.getElementById("mirror");
      const stats = document.getElementById("stats");
      const msg = document.getElementById("msg");
      let stream = null;

      function showMsg(text) {
        msg.textContent = text;
        msg.hidden = false;
        video.hidden = true;
      }

      async function listCameras() {
        const devices = (
          await navigator.mediaDevices.enumerateDevices()
        ).filter((d) => d.kind === "videoinput");
        const prev = cameraSel.value;
        cameraSel.innerHTML = "";
        devices.forEach((d, i) => {
          const opt = document.createElement("option");
          opt.value = d.deviceId;
          opt.textContent = d.label || `Camera ${i + 1}`;
          cameraSel.appendChild(opt);
        });
        if (devices.some((d) => d.deviceId === prev)) cameraSel.value = prev;
        return devices;
      }

      async function start() {
        stopCapture(); // finish any in-progress recording before switching
        if (stream) stream.getTracks().forEach((t) => t.stop());
        const [w, h] = resSel.value.split("x").map(Number);
        const constraints = {
          audio: false,
          video: {
            width: { ideal: w },
            height: { ideal: h },
            ...(cameraSel.value
              ? { deviceId: { exact: cameraSel.value } }
              : {}),
          },
        };
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          video.hidden = false;
          msg.hidden = true;
          // Labels are only available after permission is granted, so re-list.
          const activeId = stream.getVideoTracks()[0].getSettings().deviceId;
          await listCameras();
          if (activeId) cameraSel.value = activeId;
        } catch (err) {
          showMsg(`Could not open camera: ${err.name} — ${err.message}`);
        }
      }

      // FPS + resolution readout
      let frames = 0,
        last = performance.now();
      function tick() {
        frames++;
        const now = performance.now();
        if (now - last >= 1000) {
          const fps = ((frames * 1000) / (now - last)).toFixed(1);
          stats.textContent = video.videoWidth
            ? `${video.videoWidth}×${video.videoHeight} · ${fps} fps`
            : "";
          frames = 0;
          last = now;
        }
        if ("requestVideoFrameCallback" in video)
          video.requestVideoFrameCallback(tick);
        else requestAnimationFrame(tick);
      }
      if ("requestVideoFrameCallback" in video)
        video.requestVideoFrameCallback(tick);
      else requestAnimationFrame(tick);

      const statusEl = document.getElementById("status");
      const captureBtn = document.getElementById("capture");
      const stamp = () => new Date().toISOString().replace(/[:.]/g, "-");

      // Upload a blob to the local server, which writes it into data/.
      async function save(blob, name) {
        statusEl.textContent = `Saving ${name}…`;
        try {
          const res = await fetch(`/save?name=${encodeURIComponent(name)}`, {
            method: "POST",
            body: blob,
          });
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          statusEl.textContent = `Saved ${await res.text()}`;
        } catch (err) {
          statusEl.textContent = `Save failed: ${err.message} (is viewer/server.py running?)`;
        }
      }

      document.getElementById("snapshot").onclick = () => {
        if (!video.videoWidth) return;
        const c = document.createElement("canvas");
        c.width = video.videoWidth;
        c.height = video.videoHeight;
        const ctx = c.getContext("2d");
        if (mirror.checked) {
          ctx.translate(c.width, 0);
          ctx.scale(-1, 1);
        }
        ctx.drawImage(video, 0, 0);
        c.toBlob((blob) => save(blob, `snapshot-${stamp()}.png`), "image/png");
      };

      // Video capture: toggle recording of the live stream.
      const MIME_TYPES = [
        ["video/mp4;codecs=avc1", ".mp4"],
        ["video/mp4", ".mp4"],
        ["video/webm;codecs=vp9", ".webm"],
        ["video/webm", ".webm"],
      ];
      let recorder = null;
      let recordStart = 0;
      let recordTimer = null;

      function startCapture() {
        if (!stream) return;
        const [mimeType, ext] = MIME_TYPES.find(([t]) =>
          MediaRecorder.isTypeSupported(t),
        ) ?? ["", ".webm"];
        const chunks = [];
        const name = `capture-${stamp()}${ext}`;
        // Keep a local reference: `recorder` is nulled in stopCapture() before
        // the async onstop fires.
        const rec = new MediaRecorder(stream, {
          ...(mimeType ? { mimeType } : {}),
          videoBitsPerSecond: 8_000_000,
        });
        rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
        rec.onstop = () => save(new Blob(chunks, { type: rec.mimeType }), name);
        rec.onerror = (e) =>
          (statusEl.textContent = `Recording error: ${e.error?.message ?? e}`);
        rec.start(1000);
        recorder = rec;
        recordStart = performance.now();
        captureBtn.classList.add("recording");
        recordTimer = setInterval(() => {
          const s = Math.floor((performance.now() - recordStart) / 1000);
          captureBtn.textContent = `■ Stop ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
        }, 250);
        captureBtn.textContent = "■ Stop 0:00";
        statusEl.textContent = "Recording…";
      }

      function stopCapture() {
        if (!recorder) return;
        recorder.stop();
        recorder = null;
        clearInterval(recordTimer);
        captureBtn.classList.remove("recording");
        captureBtn.textContent = "● Capture";
      }

      captureBtn.onclick = () => (recorder ? stopCapture() : startCapture());
      mirror.onchange = () => video.classList.toggle("mirror", mirror.checked);
      cameraSel.onchange = start;
      resSel.onchange = start;
      document.getElementById("refresh").onclick = listCameras;
      navigator.mediaDevices?.addEventListener("devicechange", listCameras);

      if (!navigator.mediaDevices?.getUserMedia) {
        showMsg(
          "Camera API unavailable. Open this page via http://localhost (see README).",
        );
      } else {
        start();
      }
    </script>
  </body>
</html>
